# Tests use jsdom and recorded chunk fixtures: no keys, models or browsers are needed.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly check that dependencies and runtimes did not break the build
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node examples/replay.mjs --lang en
      - run: node examples/replay.mjs --lang ko --mode sentence --fixture ko-basic
